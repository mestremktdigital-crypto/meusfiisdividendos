name: Atualizar Comunicados de FIIs
on:
  schedule:
    # Executa todos os dias às 10:00 UTC e 22:00 UTC (exemplo)
    - cron: '0 10,22 * * *'
  workflow_dispatch: # Permite disparar manualmente

jobs:
  update-comunicados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Script de Comunicados
        run: |
          python scripts/scraper_comunicados.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add comunicados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: atualização comunicados FIIs [skip ci]" && git push)
