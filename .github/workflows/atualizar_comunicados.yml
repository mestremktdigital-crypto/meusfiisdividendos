name: Atualizar Comunicados

on:
  schedule:
    - cron: '0 10,22 * * *' # Roda automaticamente às 10h e 22h (UTC) - 2 vezes ao dia
  workflow_dispatch: # Permite que você rode manualmente com um clique na aba Actions do GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Rodar script de scraping
        run: python scripts/scraper_comunicados.py

      - name: Fazer commit do JSON atualizado
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add comunicados.json
          # O comando abaixo verifica se teve mudança, e se tiver, ele salva no seu repositório
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizando comunicados automaticamente" && git push)
