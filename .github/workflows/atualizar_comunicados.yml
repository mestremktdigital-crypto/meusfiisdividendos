name: Atualizar Comunicados de FIIs
on:
  schedule:
    # Executa de segunda a sexta às 18:00 (Horário de Brasília).
    # BRT = UTC-3 sem horário de verão -> 18:00 BRT = 21:00 UTC do mesmo dia.
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite disparar manualmente

jobs:
  update-comunicados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Script de Comunicados
        run: |
          python scripts/scraper_comunicados.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add comunicados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: atualização comunicados FIIs [skip ci]" && git push)
