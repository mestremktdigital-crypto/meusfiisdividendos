name: Atualizar Dados de Mercado FIIs

on:
  schedule:
    - cron: '0 21 * * 1-5' # Roda às 18:00 (Horário de Brasília) de segunda a sexta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar fiis.json
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python update_fiis.py

      - name: Commit e Push das alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fiis.json
          git commit -m "auto: atualiza dados de mercado fiis.json [skip ci]" || echo "Nenhuma alteracao para commitar"
          git push
