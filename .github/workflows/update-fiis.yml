name: Atualizar Dados dos FIIs

on:
  schedule:
    # Executa todos os dias às 09:00 e 21:00 UTC (06:00 e 18:00 Horário de Brasília)
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Permite rodar manualmente no botão "Run workflow"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de atualização dos FIIs
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          BRAPI_PLAN: "free" # Altere para "pro" caso tenha o plano pago da brapi
        run: |
          python update_fiis.py

      - name: Salvar fiis.json no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fiis.json
          git commit -m "chore: atualizado fiis.json [skip ci]" || echo "Nenhuma alteração para salvar"
          git push
